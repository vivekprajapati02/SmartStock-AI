name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: smartstock
          POSTGRES_PASSWORD: smartstock
          POSTGRES_DB: smartstock_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartstock -d smartstock_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The application connects as a non-superuser so RLS is enforced
      # (superusers bypass row-level security even with FORCE).
      TEST_DATABASE_URL: postgresql+psycopg2://smartstock_app:smartstock_app@localhost:5432/smartstock_test
      DATABASE_URL: postgresql+psycopg2://smartstock_app:smartstock_app@localhost:5432/smartstock_test
      JWT_SECRET_KEY: ci-only-secret-not-used-anywhere-else-0123456789
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Create non-superuser application role
        env:
          PGPASSWORD: smartstock
        run: |
          psql -h localhost -U smartstock -d smartstock_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE smartstock_app LOGIN PASSWORD 'smartstock_app';
          ALTER DATABASE smartstock_test OWNER TO smartstock_app;
          ALTER SCHEMA public OWNER TO smartstock_app;
          SQL

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check app seed tests

      - name: Tests (SQLite + PostgreSQL integration)
        run: python -m pytest -ra

      - name: Migrations and seed smoke test
        run: |
          alembic upgrade head
          python -m seed.generate --slug ci-demo --days 120 --products 4 --stores 1

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build web
        run: flutter build web --release

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, flutter]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: smartstock-api:ci
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: mobile
          push: false
          tags: smartstock-web:ci
