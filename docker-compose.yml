# SmartStock AI - local development stack (PostgreSQL + API + web client).
# Usage: docker compose up --build
services:
  db:
    image: postgres:15-alpine
    environment:
      # Admin (superuser) account for maintenance only. The API connects as
      # the non-superuser `smartstock` role created by docker/initdb, so
      # row-level security is enforced.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres-dev-only}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - smartstock_pgdata:/var/lib/postgresql/data
      - ./backend/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartstock -d smartstock"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # Overrides the default localhost URL so the API reaches the `db` service.
      DATABASE_URL: postgresql+psycopg2://smartstock:smartstock@db:5432/smartstock
      ENVIRONMENT: development
      DEBUG: "false"
      LOG_LEVEL: INFO
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-long-random-secret-value}
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Flutter web client behind nginx; /api is proxied to the api service so the
  # browser uses one origin: http://localhost:8080
  web:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    environment:
      API_UPSTREAM: http://api:8000
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  smartstock_pgdata:
